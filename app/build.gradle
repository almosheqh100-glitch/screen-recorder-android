plugins { id 'com.android.application' }
android {
 namespace 'com.example.screenrecorder'
 compileSdk 35
 defaultConfig { applicationId 'com.example.screenrecorder'; minSdk 29; targetSdk 35; versionCode 6; versionName '1.5' }
 signingConfigs {
  release {
   storeFile file(System.getenv('SIGNING_KEYSTORE') ?: 'release.keystore')
   storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: ''
   keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: ''
   keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: ''
  }
 }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.15.0' }
